<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Восемь долей, две группы · Мриданга</title><style>/* Самоучитель по мриданге — мобильная тема.
   Внутри Telegram цвета берутся из themeParams (--tg-*), вне — из своей палитры. */

:root {
  --bg-d: #f8f4ee;
  --bg2-d: #efe8de;
  --surface-d: #ffffff;
  --text-d: #2b241f;
  --hint-d: #7b6f65;
  --accent-d: #b0502a;
  --accent-text-d: #ffffff;
  --link-d: #a2461f;

  --bg: var(--tg-bg, var(--bg-d));
  --bg-2: var(--tg-bg-2, var(--bg2-d));
  --surface: var(--surface-d);
  --text: var(--tg-text, var(--text-d));
  --hint: var(--tg-hint, var(--hint-d));
  --accent: var(--tg-button, var(--accent-d));
  --accent-text: var(--tg-button-text, var(--accent-text-d));
  --link: var(--tg-link, var(--link-d));
  --accent-soft: color-mix(in srgb, var(--accent) 16%, transparent);
  --line: color-mix(in srgb, var(--text) 13%, transparent);
  --now: #e9a23b;

  --draft: #8a6d1f;
  --draft-bg: #fbf1d4;
  --review: #9a5a00;
  --review-bg: #ffe8c7;
  --verified: #1f7a43;
  --verified-bg: #d9f2e2;
  --published: #156a7a;
  --published-bg: #d5eef2;
  --invalid: #b3261e;
  --invalid-bg: #fbe1de;
  --test: #3d5a8a;
  --test-bg: #e3eaf6;
  --danger: #b3261e;

  --radius: 16px;
  --gutter: 16px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg-d: #191512;
    --bg2-d: #231d18;
    --surface-d: #2a231d;
    --text-d: #f2eae1;
    --hint-d: #a89a8d;
    --accent-d: #e27c4c;
    --accent-text-d: #1a120d;
    --link-d: #f0a172;
    --draft: #e8cd7a;
    --draft-bg: #3a3218;
    --review: #ffbf6b;
    --review-bg: #3d2a10;
    --verified: #7fd6a0;
    --verified-bg: #173523;
    --published: #7fd0de;
    --published-bg: #12323a;
    --invalid: #ff9a8f;
    --invalid-bg: #3d1714;
    --test: #a9c2ee;
    --test-bg: #1c2638;
  }
}

:root[data-theme='dark'] {
  --bg-d: #191512;
  --bg2-d: #231d18;
  --surface-d: #2a231d;
  --text-d: #f2eae1;
  --hint-d: #a89a8d;
  --accent-d: #e27c4c;
  --accent-text-d: #1a120d;
  --link-d: #f0a172;
  --surface: var(--tg-bg-2, var(--surface-d));
  --draft: #e8cd7a;
  --draft-bg: #3a3218;
  --review: #ffbf6b;
  --review-bg: #3d2a10;
  --verified: #7fd6a0;
  --verified-bg: #173523;
  --published: #7fd0de;
  --published-bg: #12323a;
  --invalid: #ff9a8f;
  --invalid-bg: #3d1714;
  --test: #a9c2ee;
  --test-bg: #1c2638;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
a { color: var(--link); }
h1 { font-size: 26px; line-height: 1.15; margin: 4px 0 6px; letter-spacing: -0.01em; }
h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--hint); margin: 0 0 10px; }
.card h2 + * { margin-top: 0; }
.card h2:not(:first-child) { margin-top: 18px; }
p { margin: 0 0 8px; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; }
button, select, input { font: inherit; color: inherit; }
.boot { padding: 40px var(--gutter); color: var(--hint); }

#app { max-width: 520px; margin: 0 auto; min-height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 10px;
  padding: calc(8px + env(safe-area-inset-top)) var(--gutter) 8px;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar .brand { font-weight: 700; text-decoration: none; color: var(--text); }
.topbar .back { text-decoration: none; font-weight: 600; min-height: 36px; display: inline-flex; align-items: center; }
.topbar .back[hidden] { display: none; }
.topbar .env { margin-left: auto; font-size: 12px; color: var(--hint); border: 1px solid var(--line); border-radius: 99px; padding: 2px 8px; }

main { outline: none; }
.screen { padding: 14px var(--gutter) calc(32px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.screen-head .lead, .hero .lead { color: var(--hint); }
.eyebrow { font-size: 13px; color: var(--hint); margin: 0; }
.section-title { margin: 4px 0 -4px; }
.hint { color: var(--hint); font-size: 13px; }
.center { text-align: center; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  color: inherit;
  text-decoration: none;
  display: block;
}

/* Маркировка статуса */
.badge { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
.badge-draft { color: var(--draft); background: var(--draft-bg); }
.badge-review { color: var(--review); background: var(--review-bg); }
.badge-verified { color: var(--verified); background: var(--verified-bg); }
.badge-published { color: var(--published); background: var(--published-bg); }
.badge-invalid { color: var(--invalid); background: var(--invalid-bg); }
.chip { display: inline-block; font-size: 12px; padding: 3px 8px; border-radius: 99px; background: var(--bg-2); color: var(--hint); }
.chip.warn { color: var(--review); background: var(--review-bg); margin-left: 6px; }
.banner { border-radius: 12px; padding: 10px 12px; font-size: 14px; border-left: 4px solid currentColor; }
.banner p:last-child { margin: 0; }
.banner-draft { color: var(--draft); background: var(--draft-bg); }
.banner-review { color: var(--review); background: var(--review-bg); }
.banner-invalid { color: var(--invalid); background: var(--invalid-bg); }
.banner-invalid a { color: inherit; font-weight: 600; }
/* Тестовое происхождение — отдельный тон, не путать со статусом проверки */
.origin-mark { margin: 6px 0 8px; padding: 8px 10px; border-radius: 10px; font-size: 14px; color: var(--test); background: var(--test-bg); border: 1px dashed currentColor; }
.origin-mark p { margin: 0; }
.origin-mark p + p { margin-top: 4px; color: var(--text); }
.chip.test { color: var(--test); background: var(--test-bg); }
.banner p { color: var(--text); }
.draft-term { text-decoration: underline dashed color-mix(in srgb, currentColor 55%, transparent); text-underline-offset: 3px; }

/* Главная */
.hero { text-align: center; padding: 8px 0 0; }
.hero-mark svg { width: 120px; height: 60px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile {
  display: grid; gap: 2px; padding: 14px; min-height: 96px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  text-decoration: none; color: var(--text);
}
.tile:active, .card.item:active { transform: scale(0.985); }
.tile-icon { font-size: 22px; color: var(--accent); }
.tile small { color: var(--hint); }
.continue { display: grid; gap: 2px; border-color: var(--accent); }
.continue small { color: var(--accent); font-weight: 600; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
.stat-row b { display: block; font-size: 22px; }
.stat-row small { color: var(--hint); font-size: 12px; }

/* Списки */
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.card.item { display: flex; gap: 12px; align-items: flex-start; }
.item-num {
  flex: none; width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 700;
  background: var(--accent-soft); color: var(--accent);
}
.item-body { display: grid; gap: 6px; min-width: 0; }
.item-body p { margin: 0; color: var(--hint); font-size: 14px; }
.formula-preview { display: grid; gap: 2px; }
.formula-inline { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 14px; }
.formula-inline .fi-accent { font-weight: 800; color: var(--accent); }
.formula-inline .fi-rest { color: var(--hint); }
.formula-inline .fi-group { color: var(--hint); }
.formula-inline .fi-multi { display: inline-flex; gap: 3px; padding: 0 5px; border-radius: 6px; background: var(--bg-2); }

/* Ритмическая сетка */
.rhythm-grid { display: grid; gap: 12px; }
.cycle-label { font-size: 12px; color: var(--hint); margin-bottom: 4px; font-weight: 600; }
.beats { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 6px 4px; }
.beat {
  border-radius: 10px; padding: 4px; display: grid; gap: 4px;
  background: var(--bg-2); border: 2px solid transparent;
  transition: border-color 60ms linear;
}
.beat.metro-odd { background: color-mix(in srgb, var(--bg-2) 55%, var(--surface)); }
.beat.group-start { box-shadow: -4px 0 0 -1px var(--surface), -6px 0 0 -1px var(--accent); }
.beats[style*='--cols: 4'] .beat.group-start:nth-child(4n + 1),
.beats[style*='--cols: 2'] .beat.group-start:nth-child(2n + 1) { box-shadow: none; border-top: 2px solid var(--accent); }
.beat.now { border-color: var(--now); }
.subs { display: grid; grid-template-columns: repeat(var(--subs), minmax(0, 1fr)); gap: 2px; min-height: 48px; }
.sub {
  position: relative; display: grid; place-items: center; border-radius: 7px;
  background: var(--surface); min-width: 0; overflow: hidden; padding: 0 1px;
  transition: background-color 60ms linear, transform 60ms linear;
}
.sub .mark { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: clip; max-width: 100%; }
.beat.subs-2 .mark { font-size: 13px; }
.beat.subs-3 .mark { font-size: 11px; }
.beat:is(.subs-4, .subs-5, .subs-6, .subs-7, .subs-8) .mark { font-size: 10px; }
.sub.accent { background: var(--accent-soft); }
.sub.accent .mark { font-weight: 800; color: var(--accent); }
.accent-mark { position: absolute; top: 0; left: 3px; font-size: 12px; font-weight: 900; color: var(--accent); line-height: 1; }
.sub.rest { background: transparent; border: 1.5px dashed var(--line); }
.sub.rest .mark { color: var(--hint); font-size: 22px; line-height: 1; }
.sub.now { background: var(--now); transform: scale(1.04); }
.sub.now .mark, .sub.now .accent-mark { color: #1d140c; }
.beat-num { text-align: center; font-size: 12px; font-weight: 700; color: var(--hint); }
.beat-num.off { font-weight: 400; opacity: 0.7; }
.legend-box summary { cursor: pointer; color: var(--link); font-size: 14px; margin-top: 8px; }
.legend { list-style: none; padding: 0; margin: 8px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 13px; color: var(--hint); }
.lg { display: inline-block; min-width: 34px; text-align: center; padding: 1px 4px; border-radius: 6px; background: var(--bg-2); color: var(--text); font-weight: 600; }
.lg-accent { color: var(--accent); background: var(--accent-soft); }
.lg-rest { border: 1.5px dashed var(--line); background: transparent; }
.lg-group { color: var(--accent); }

/* Управление */
.segmented { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--bg-2); border-radius: 12px; }
.seg {
  border: 0; border-radius: 9px; padding: 8px 6px; background: transparent; cursor: pointer;
  display: grid; gap: 1px; font-weight: 600; min-height: 48px;
}
.seg small { font-weight: 400; font-size: 11px; color: var(--hint); }
.seg.active { background: var(--surface); box-shadow: 0 1px 3px rgb(0 0 0 / 12%); color: var(--accent); }
.tempo { display: grid; gap: 6px; }
.tempo-row { display: flex; align-items: center; justify-content: space-between; }
.tempo-value b { font-size: 34px; font-variant-numeric: tabular-nums; }
.tempo-value small { color: var(--hint); }
.tempo-range { display: flex; justify-content: space-between; font-size: 12px; color: var(--hint); }
input[type='range'] { width: 100%; accent-color: var(--accent); min-height: 32px; }
.round {
  width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--bg-2); font-size: 24px; font-weight: 600; cursor: pointer; line-height: 1;
}
.round.small { width: 40px; height: 40px; font-size: 20px; }
.round:active { background: var(--accent-soft); }
.stepper { display: inline-flex; align-items: center; gap: 8px; }
.stepper-value { min-width: 48px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.repeat-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; min-height: 40px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }

/* Счётчик */
.counter { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 8px; }
.counter-cells { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
.cc span { display: block; font-size: 12px; color: var(--hint); text-transform: uppercase; letter-spacing: 0.05em; }
.cc b { font-size: 28px; font-variant-numeric: tabular-nums; }
.cycle-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; min-height: 10px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bg-2); border: 1px solid var(--line); }
.dot.done { background: var(--accent); border-color: var(--accent); }
.dot.cur { background: var(--now); border-color: var(--now); }
.counter-phase { text-align: center; font-size: 14px; color: var(--hint); }

/* Кнопки */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions.single { grid-template-columns: 1fr; }
.btn {
  min-height: 52px; border-radius: 14px; border: 1px solid transparent; padding: 0 16px;
  font-weight: 700; font-size: 16px; cursor: pointer;
}
.btn[hidden] { display: none; }
.btn.primary { background: var(--accent); color: var(--accent-text); }
.btn.secondary { background: var(--accent-soft); color: var(--accent); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--text); }
.btn.big { min-height: 60px; font-size: 18px; }
.btn.stop { background: var(--text); color: var(--bg); }
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); width: 100%; }
.btn:disabled { opacity: 0.6; }

/* Метроном */
.metro-lights { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 14px; }
.light {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: var(--bg-2); color: var(--hint); font-weight: 700; font-size: 14px;
  border: 2px solid var(--line); transition: background-color 50ms linear;
}
.light.first { border-color: var(--accent); }
.light.on { background: var(--now); color: #1d140c; border-color: var(--now); }
.light.first.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

/* Описание материала */
.meta { display: grid; grid-template-columns: minmax(96px, auto) 1fr; gap: 8px 12px; margin: 0; font-size: 14px; }
.meta dt { color: var(--hint); }
.meta dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.meta .badge { white-space: normal; }
.formula-src { display: block; background: var(--bg-2); padding: 4px 6px; border-radius: 6px; margin-bottom: 4px; }
.progress-line { font-weight: 600; }

/* Настройки */
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); min-height: 48px; }
.set-row:last-child { border-bottom: 0; }
.set-row > span:first-child { display: grid; }
.set-row small { color: var(--hint); font-size: 12px; }
.set-row.disabled { opacity: 0.65; }
.set-row select { padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2); max-width: 60%; min-width: 0; flex: 0 1 auto; text-overflow: ellipsis; }
.range-wrap { display: flex; align-items: center; gap: 8px; width: 50%; }
.range-wrap output { min-width: 40px; text-align: right; font-size: 13px; color: var(--hint); }
.switch { appearance: none; width: 46px; height: 28px; border-radius: 99px; background: var(--bg-2); border: 1px solid var(--line); position: relative; flex: none; cursor: pointer; transition: background-color 120ms; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / 25%); transition: transform 120ms; }
.switch:checked { background: var(--accent); border-color: var(--accent); }
.switch:checked::after { transform: translateX(18px); }
.switch:disabled { cursor: not-allowed; }

/* Термины */
.term { display: grid; gap: 6px; }
.term-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.term-label { font-size: 22px; }
.errors { color: var(--danger); font-size: 13px; padding-left: 18px; }

/* Панель тренировки: лента, «Без движения», сетка. Во время игры прилипает под шапкой,
   чтобы «Стоп» и ближайшие удары были видны вместе без прокрутки к ним. */
.practice-panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px; display: grid; gap: 8px;
}
.practice-panel.playing {
  position: sticky; z-index: 4;
  top: calc(53px + env(safe-area-inset-top));
  box-shadow: 0 6px 18px rgb(0 0 0 / 14%);
}
.practice-panel .actions { gap: 8px; }
.panel-marks { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.panel-marks .badge { white-space: normal; }
.practice-panel .btn { min-height: 48px; }
.lane-view { display: grid; gap: 8px; }
.view-switch .seg { min-height: 36px; padding: 4px; font-size: 13px; }
.lane-view [hidden] { display: none !important; }
.lane-status { margin: 0; font-size: 12px; color: var(--hint); text-align: center; min-height: 2.6em; }
.lane-view[data-state='hidden'] .lane-status { color: var(--review); font-weight: 600; }

.lane {
  --card-w: 60px; --marker-x: 96px;
  position: relative; height: 152px; overflow: hidden; border-radius: 12px;
  background: var(--bg-2); touch-action: pan-y; contain: layout paint;
}
.lane-strip {
  position: absolute; inset: 0 auto 0 0; width: 0;
  will-change: transform; pointer-events: none;
}
.lane-strip .lc {
  position: absolute; top: 22px; left: calc(var(--seq) * var(--card-w));
  width: calc(var(--card-w) - 4px); margin-left: 2px; height: 106px;
}
.lane-strip .lc.past { opacity: 0.45; }
/* Линия «Сейчас» видна над и под рядом карточек и не закрывает текст */
.lane-marker {
  position: absolute; top: 14px; bottom: 0; left: calc(var(--marker-x) - 1.5px);
  width: 3px; pointer-events: none;
  background: linear-gradient(to bottom, var(--now) 0 9px, transparent 9px calc(100% - 26px), var(--now) calc(100% - 26px));
}
.lane-marker::before {
  content: ''; position: absolute; top: -2px; left: -4.5px;
  border: 6px solid transparent; border-top-color: var(--now); border-bottom: 0;
}
.lane-marker span {
  position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
  font-size: 11px; font-weight: 800; color: var(--text); background: var(--now);
  color: #1d140c; padding: 0 6px; border-radius: 99px; white-space: nowrap;
}

/* Карточка удара (лента и «Без движения») */
.lc {
  display: grid; grid-template-rows: auto auto auto 1fr; justify-items: center; align-content: start;
  gap: 1px; padding: 3px 2px; border-radius: 9px; background: var(--surface);
  border: 1.5px solid var(--line); text-align: center; overflow: hidden; min-width: 0;
}
.lc-top { display: flex; gap: 4px; justify-content: center; font-size: 11px; color: var(--hint); font-weight: 700; min-height: 15px; }
.lc-sub { font-weight: 400; }
.lc-main { font-size: 18px; font-weight: 600; line-height: 1.15; min-height: 1.15em; white-space: nowrap; max-width: 100%; overflow: hidden; }
.lc > * { min-height: min-content; }
.lc-main.long { font-size: 15px; }
.lc-main.xlong { font-size: 13px; }
.lc-accent { color: var(--accent); font-weight: 900; margin-right: 1px; }
.lc.accent { border-color: var(--accent); border-width: 2.5px; }
.lc.accent .lc-main { color: var(--accent); font-weight: 800; }
.lc-flag { font-size: 10px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.03em; }
.lc-tech { max-width: 100%; font-size: 9px; line-height: 1.15; letter-spacing: -0.02em; overflow-wrap: normal; word-break: normal; hyphens: none; color: var(--hint); display: grid; justify-items: center; gap: 1px; }
.lc-tech.unknown { font-style: italic; }
/* Признаки техники: рука и мембрана (Р:П, М:Л), пальцы, приём (значок легенды) */
.tech-row { display: flex; align-items: center; justify-content: center; gap: 2px; min-height: 0; }
.tech-row:empty { display: none; }
.tech-sides { display: grid; text-align: left; font-weight: 700; line-height: 1.1; white-space: nowrap; }
.tech-fingers { max-width: 100%; }
.tech-method b { font-size: 11px; font-weight: 800; color: var(--text); }
.lc.now .tech-method b { color: #1d140c; }
.lc-tech.full { font-size: 10px; letter-spacing: 0; }
.lc-tech.full .tech-method { white-space: normal; }
.tech-legend { margin: 0; font-size: 11px; line-height: 1.3; color: var(--hint); display: grid; gap: 2px; text-align: center; }
.tech-legend b { color: var(--text); }
.lc-tech.invalid { color: var(--invalid); font-style: normal; font-weight: 700; }
.lc-unverified { font-size: 9px; color: var(--review); white-space: nowrap; }
.lc-unverified .full { display: none; }
.still .lc-unverified .full { display: inline; }
.still .lc-unverified .short { display: none; }
.lc.rest { background: transparent; border-style: dashed; }
.lc.rest .lc-main { font-size: 13px; color: var(--hint); font-weight: 500; padding-top: 6px; }
.lc.count-in { background: transparent; border-style: dotted; }
.lc.count-in .lc-main { font-size: 22px; color: var(--hint); }
.lc.count-in .lc-count { font-weight: 400; }
.lc.end { background: var(--bg); border-style: double; border-width: 3px; }
.lc.end .lc-main { font-size: 13px; padding-top: 14px; }
.lc.empty { background: transparent; border-style: dashed; }
.lc.empty .lc-main { color: var(--hint); padding-top: 22px; }
.lc.now { background: var(--now); border-color: var(--now); }
.lc.now .lc-main, .lc.now .lc-top, .lc.now .lc-tech, .lc.now .lc-accent, .lc.now .lc-flag, .lc.now .lc-unverified { color: #1d140c; }
/* Поддоли одной доли — общая полоса снизу */
.lc.in-beat { box-shadow: inset 0 -4px 0 color-mix(in srgb, var(--accent) 35%, transparent); }
.lane-strip .lc.in-beat:not(.sub-last) { margin-right: -2px; border-top-right-radius: 3px; border-bottom-right-radius: 3px; }
.lane-strip .lc.in-beat:not(.sub-first) { border-top-left-radius: 3px; border-bottom-left-radius: 3px; }
/* Граница цикла: подпись над карточкой и черта слева */
.lc-boundary {
  position: absolute; top: -20px; left: -2px; white-space: nowrap;
  font-size: 10px; font-weight: 700; color: var(--accent);
}
.lane-strip .lc.cycle-start { overflow: visible; border-left: 3px solid var(--accent); }
.lane-strip .lc.cycle-start .lc-boundary { top: -21px; }
/* Левая полоса начала цикла сужает карточку: «уточняется» не должно выходить за край */
.lane-strip .lc.cycle-start .lc-tech.unknown { letter-spacing: -0.06em; }
.still .lc.cycle-start .lc-boundary { position: static; order: -1; white-space: normal; font-size: 10px; }
.still .lc { position: relative; min-height: 108px; }
.still .lc.cycle-start { border-left: 3px solid var(--accent); }
.hand { color: currentColor; }
.hand .finger, .hand .palm { fill: none; stroke: currentColor; stroke-width: 1.3; }
.hand .on { fill: currentColor; }

.still { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.still-slot { display: grid; gap: 4px; min-width: 0; }

.still-slot:first-child .still-title { color: var(--text); }
.panel-grid .rhythm-grid { gap: 6px; }

.counter.compact { padding: 6px 8px; gap: 4px; border: 0; background: transparent; }
.counter.compact .cc b { font-size: 20px; }
.counter.compact .cc span { font-size: 10px; }

.tiles .tile:last-child:nth-child(odd) { grid-column: span 2; min-height: 72px; }

:focus-visible { outline: 3px solid var(--now); outline-offset: 2px; }
